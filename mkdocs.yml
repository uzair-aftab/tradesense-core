site_name: TradeSense
site_description: Multi-Factor Trading Signal Scanner Documentation
site_author: Uzair Aftab
site_url: https://uzair-aftab.github.io/tradesense/

repo_name: uzair-aftab/tradesense
repo_url: https://github.com/uzair-aftab/tradesense

theme:
  name: material
  palette:
    - scheme: slate
      primary: green
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Modules:
    - Data Layer: modules/data-layer.md
    - Technical Analysis: modules/technical-analysis.md
    - Sentiment Engine: modules/sentiment-engine.md
    - Signals: modules/signals.md
    - Backtesting: modules/backtesting.md
  - API Reference: api/reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/uzair-aftab
  generator: false
